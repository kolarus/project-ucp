<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 750" width="1120" height="750" role="img" aria-labelledby="title desc">
  <title id="title">bmorozov.com — build and deploy architecture</title>
  <desc id="desc">A push to main runs GitHub Actions, which builds a Docker image, pushes it to Amazon ECR and deploys it over SSM to an EC2 host where Caddy reverse-proxies the Next.js container. Terraform provisions the AWS resources; Cloudflare provides DNS and proxying for visitors, whose browsers send analytics events to Amplitude; the stats page reads them back server-side through the Dashboard REST API.</desc>

  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #171717; }
    .h { font-size: 22px; font-weight: 650; }
    .sub { font-size: 13px; fill: #6b7280; }
    .box-title { font-size: 14px; font-weight: 620; }
    .box-sub { font-size: 12px; fill: #6b7280; }
    .group-title { font-size: 12px; font-weight: 620; fill: #6b7280; letter-spacing: 0.08em; }
    .edge-label { font-size: 11px; fill: #6b7280; }
    .box { fill: #ffffff; stroke: #d4d4d4; stroke-width: 1.5; }
    .inner { fill: #fafafa; stroke: #d4d4d4; stroke-width: 1.5; }
    .group { fill: none; stroke: #d4d4d4; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .edge { stroke: #171717; stroke-width: 1.5; fill: none; }
    .edge-dim { stroke: #9ca3af; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .edge-live { stroke: #059669; stroke-width: 1.8; fill: none; }
    .live-text { fill: #059669; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#171717"/>
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
    <marker id="arrow-live" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="1120" height="750" fill="#ffffff"/>

  <text class="h" x="40" y="46">bmorozov.com — build and deploy</text>
  <text class="sub" x="40" y="68">One push to main ships a new image. The commit in the site footer is the one running.</text>

  <!-- monorepo -->
  <rect class="group" x="40" y="100" width="300" height="250" rx="12"/>
  <text class="group-title" x="56" y="124">MONOREPO · project-ucp</text>

  <rect class="box" x="60" y="136" width="260" height="58" rx="10"/>
  <text class="box-title" x="76" y="160">apps/web/bmorozovcom</text>
  <text class="box-sub" x="76" y="179">Next.js · standalone output · Dockerfile</text>

  <rect class="box" x="60" y="204" width="260" height="58" rx="10"/>
  <text class="box-title" x="76" y="228">apps/infra</text>
  <text class="box-sub" x="76" y="247">Terraform (AWS provider)</text>

  <rect class="box" x="60" y="272" width="260" height="58" rx="10"/>
  <text class="box-title" x="76" y="296">.github/workflows</text>
  <text class="box-sub" x="76" y="315">on: push → main</text>

  <!-- CI -->
  <rect class="box" x="396" y="136" width="260" height="170" rx="10"/>
  <text class="box-title" x="412" y="162">GitHub Actions</text>
  <text class="box-sub" x="412" y="186">OIDC → AWS role (no static keys)</text>
  <text class="box-sub" x="412" y="209">docker build (GIT_SHA, Amplitude key)</text>
  <text class="box-sub" x="412" y="232">push :sha and :latest</text>
  <text class="box-sub" x="412" y="255">secret → Parameter Store; ssm deploy</text>
  <text class="box-sub" x="412" y="285">context: repo root, -f apps/…/Dockerfile</text>

  <!-- AWS -->
  <rect class="group" x="760" y="100" width="320" height="420" rx="12"/>
  <text class="group-title" x="776" y="124">AWS · eu-north-1</text>

  <rect class="box" x="780" y="136" width="280" height="58" rx="10"/>
  <text class="box-title" x="796" y="160">Amazon ECR</text>
  <text class="box-sub" x="796" y="179">personal/bmorozovcom · keeps last 10</text>

  <rect class="box" x="780" y="250" width="280" height="250" rx="10"/>
  <text class="box-title" x="796" y="274">EC2 t3.micro · Ubuntu 24.04</text>
  <text class="box-sub" x="796" y="293">Elastic IP · SG 80/443 · SSM agent</text>

  <rect class="inner" x="800" y="312" width="240" height="58" rx="8"/>
  <text class="box-title" x="816" y="336">Caddy :80 / :443</text>
  <text class="box-sub" x="816" y="355">TLS + reverse proxy</text>

  <rect class="inner" x="800" y="412" width="240" height="66" rx="8"/>
  <text class="box-title" x="816" y="436">Docker container</text>
  <text class="box-sub" x="816" y="455">node server.js · 127.0.0.1:3000</text>

  <!-- visitor path -->
  <rect class="box" x="60" y="560" width="180" height="58" rx="10"/>
  <text class="box-title" x="76" y="584">Visitor</text>
  <text class="box-sub" x="76" y="603">bmorozov.com</text>

  <rect class="box" x="320" y="560" width="220" height="58" rx="10"/>
  <text class="box-title" x="336" y="584">Cloudflare</text>
  <text class="box-sub" x="336" y="603">DNS + proxy</text>

  <rect class="box" x="60" y="664" width="300" height="58" rx="10"/>
  <text class="box-title" x="76" y="688">Amplitude (US)</text>
  <text class="box-sub" x="76" y="707">page views · attribution · 4 events · app_version</text>

  <!-- edges -->
  <path class="edge" d="M 320 301 L 396 240" marker-end="url(#arrow)"/>
  <text class="edge-label" x="326" y="272">git push</text>

  <path class="edge" d="M 656 176 L 780 162" marker-end="url(#arrow)"/>
  <text class="edge-label" x="664" y="152">docker push</text>

  <path class="edge" d="M 656 272 L 780 312" marker-end="url(#arrow)"/>
  <text class="edge-label" x="660" y="258">ssm send-command</text>

  <path class="edge" d="M 920 194 L 920 250" marker-end="url(#arrow)"/>
  <text class="edge-label" x="930" y="226">docker pull + run</text>

  <path class="edge" d="M 920 370 L 920 412" marker-end="url(#arrow)"/>
  <text class="edge-label" x="930" y="396">proxy :3000</text>

  <path class="edge-live" d="M 240 589 L 320 589" marker-end="url(#arrow-live)"/>
  <text class="edge-label live-text" x="248" y="580">https</text>

  <path class="edge-live" d="M 540 589 L 920 589 L 920 502" marker-end="url(#arrow-live)"/>
  <text class="edge-label live-text" x="640" y="580">proxied → Elastic IP</text>

  <path class="edge" d="M 150 618 L 150 664" marker-end="url(#arrow)"/>
  <text class="edge-label" x="160" y="646">analytics events from the browser</text>

  <path class="edge" d="M 1000 478 L 1000 693 L 360 693" marker-end="url(#arrow)"/>
  <text class="edge-label" x="420" y="685">stats page reads them back: Dashboard REST API, secret key, server-side</text>

  <path class="edge-dim" d="M 190 350 L 190 470 L 750 470" marker-end="url(#arrow-dim)"/>
  <text class="edge-label" x="236" y="462">terraform apply (apps/infra) — provisions ECR, EC2, EIP, IAM/OIDC, SG</text>
</svg>
