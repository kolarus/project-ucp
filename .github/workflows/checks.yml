name: Checks

# The checks a change must pass (ADR-0007, ADR-0008). Called by validate.yml on
# every push, and by deploy-app.yml, whose deploy job waits for them.

on:
  workflow_call:
    inputs:
      app:
        description: Limits the visual snapshots to one app (a directory under apps/web). Empty means every app.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # --ignore-scripts: the root `prepare` script installs git hooks, which a
      # CI checkout doesn't need. Dependency build scripts are off anyway.
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts

      - name: pnpm validate
        run: pnpm validate

  visual:
    runs-on: ubuntu-latest
    # Baselines are taken in this image as linux/amd64, which is what this
    # runner is. The tag must be the exact @playwright/test version the apps
    # pin; if they drift apart, Playwright fails to find its browser.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      # Already in the Playwright image: test-visual.mts runs Playwright directly.
      VISUAL_IN_CONTAINER: "1"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts

      - name: pnpm test:visual
        run: pnpm test:visual ${{ inputs.app }}

      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diffs
          path: apps/web/*/test-results/
          if-no-files-found: ignore
