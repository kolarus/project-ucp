name: Build, Push to ECR, and Deploy bmorozov.com

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: personal/bmorozovcom
  AMPLITUDE_SECRET_PARAMETER: /bmorozovcom/amplitude-secret-key

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg GIT_SHA=${{ github.sha }} \
            --build-arg AMPLITUDE_API_KEY=${{ vars.AMPLITUDE_API_KEY }} \
            --build-arg AMPLITUDE_SERVER_ZONE=${{ vars.AMPLITUDE_SERVER_ZONE || 'US' }} \
            -f apps/web/bmorozovcom/Dockerfile \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .

          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
      # The stats page's Amplitude secret is managed as a GitHub secret. Park
      # it in Parameter Store (encrypted) so the deploy command below only has
      # to name it — the value never appears in the SSM command or its
      # history. A failure here warns rather than blocks the deploy; the stats
      # page then says it isn't connected.
      - name: Store Amplitude secret in Parameter Store
        env:
          AMPLITUDE_SECRET_KEY: ${{ secrets.AMPLITUDE_SECRET_KEY }}
        run: |
          if [ -z "$AMPLITUDE_SECRET_KEY" ]; then
            echo "::warning::AMPLITUDE_SECRET_KEY is not set; the stats page will show as not connected."
            exit 0
          fi

          aws ssm put-parameter \
            --name "$AMPLITUDE_SECRET_PARAMETER" \
            --type SecureString \
            --value "$AMPLITUDE_SECRET_KEY" \
            --overwrite > /dev/null \
            || echo "::warning::Could not store the Amplitude secret in Parameter Store."

      - name: Deploy to EC2
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=bmorozovcom" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)

          echo "Deploying $IMAGE_TAG to $INSTANCE_ID"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY\",
              \"docker pull $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG\",
              \"docker rm -f bmorozovcom || true\",
              \"export AMPLITUDE_SECRET_KEY=\$(aws ssm get-parameter --region $AWS_REGION --name $AMPLITUDE_SECRET_PARAMETER --with-decryption --query Parameter.Value --output text 2>/dev/null || true)\",
              \"docker run -d --name bmorozovcom --restart unless-stopped -p 127.0.0.1:3000:3000 -e AMPLITUDE_SECRET_KEY $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"